<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    / is replaced by `flutter build web --base-href`.
    No inline <script> anywhere: the server's Content-Security-Policy allows
    scripts from this origin only (backend/src/web/security-headers.ts).
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="تطبيق جامع التقوى: الحضور والتسميع والنقاط وإعلانات الحلقات.">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#1B4F72">
  <meta name="format-detection" content="telephone=no">

  <!-- Installed (home-screen) web app on iPhone/iPad and Android -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="التقوى">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>التقوى</title>

  <style>
    html, body { margin: 0; height: 100%; background: #0D1B2A; }
    #taqwa-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: linear-gradient(180deg, #0D1B2A 0%, #16213E 70%, #1B4F72 100%);
      color: rgba(255, 255, 255, 0.55);
      font: 14px/1.6 system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    }
    #taqwa-splash img { width: 112px; height: 112px; border-radius: 28px; box-shadow: 0 0 40px rgba(212, 172, 13, 0.18); }
    #taqwa-splash .bar { width: 120px; height: 3px; border-radius: 3px; overflow: hidden; background: rgba(212, 172, 13, 0.15); }
    #taqwa-splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: #D4AC0D;
      animation: taqwa-slide 1.2s ease-in-out infinite;
    }
    @keyframes taqwa-slide { from { transform: translateX(160%); } to { transform: translateX(-160%); } }
    @media (prefers-reduced-motion: reduce) { #taqwa-splash .bar::after { animation: none; width: 100%; } }
    noscript { position: fixed; inset: auto 0 24px; text-align: center; color: #fff; font: 14px system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="taqwa-splash" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="جامع التقوى" width="112" height="112">
    <div class="bar" aria-hidden="true"></div>
    <div>جارٍ التحميل…</div>
  </div>
  <noscript>يحتاج تطبيق التقوى إلى تفعيل JavaScript في المتصفح.</noscript>

  <!-- 1. Push settings, generated by the server from FIREBASE_WEB_CONFIG. -->
  <script src="firebase-config.js"></script>
  <!-- 2. Firebase (if configured) and the Flutter app. -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
